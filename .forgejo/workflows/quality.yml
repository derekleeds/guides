name: Quality

# Merging to main deploys (Forgejo push mirror -> GitHub -> Cloudflare Pages),
# so pull requests must pass these checks before merge. Pushes to main run
# them again so every deployed commit has a result.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: docker
    container:
      image: node:24-bookworm-slim
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6
      - name: Enable pnpm via Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Build (astro check, then build)
        run: pnpm build
