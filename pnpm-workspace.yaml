allowBuilds:
  esbuild: true

nodeLinker: hoisted

# Keep the WASI runtime pair in step. Newer rolldown/astro2tsx releases
# otherwise resolve @emnapi/runtime 2.0 betas against @emnapi/core 1.x,
# and `astro check` (part of `pnpm build`) crashes with
# "this.bridge.setLastError is not a function". Remove once both resolve
# to one major version on their own.
overrides:
  "@emnapi/core": 1.11.3
  "@emnapi/runtime": 1.11.3
