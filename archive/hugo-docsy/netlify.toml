# Netlify Custom Headers for Agent Readiness
# https://isitagentready.com
# RFC 8288 Link headers for agent discovery

[[headers]]
  for = "/*"
  [headers.values]
    # Link headers for agent discovery (RFC 8288)
    Link = """</sitemap.xml>; rel="sitemap", </.well-known/api-catalog>; rel="api-catalog", </robots.txt>; rel="robots""""
    # Content-Type for markdown negotiation
    Accept-CH = "Sec-CH-UA-Platform-Version"
